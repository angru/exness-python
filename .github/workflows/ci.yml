name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: python-sdk
      - name: Read pinned Go revision
        id: peer
        run: python3 -c 'import json; print("revision=" + json.load(open("python-sdk/tools/parity-peer.json"))["revision"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: angru/exness-go
          ref: ${{ steps.peer.outputs.revision }}
          path: go-sdk
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - run: uv sync --locked
        working-directory: python-sdk
      - run: go mod download
        working-directory: go-sdk
      - name: Compare shared fixtures and actual SDK results
        env:
          UV_OFFLINE: "1"
          GOPROXY: "off"
          GOTOOLCHAIN: local
          PEER_REVISION: ${{ steps.peer.outputs.revision }}
        run: >-
          python3 python-sdk/tools/check_parity.py
          --python-root python-sdk --go-root go-sdk
          --peer go --peer-revision "$PEER_REVISION"

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          uv venv /tmp/exness-wheel
          uv pip install --python /tmp/exness-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/exness-wheel/bin/python -c 'from exness import AsyncExnessClient, ExnessClient, StreamOptions, StreamGap, TickStreamOptions; from exness.events import HmrSnapshot; from importlib.resources import files; assert StreamOptions is TickStreamOptions; assert StreamOptions().max_reconnects == 0; assert all(hasattr(AsyncExnessClient, name) for name in ("stream_ticks", "stream_trading", "stream_account_state", "stream_instruments", "stream_hmr")); assert files("exness").joinpath("py.typed").is_file()'

name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          uv venv /tmp/exness-wheel
          uv pip install --python /tmp/exness-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/exness-wheel/bin/python -c 'from exness import ExnessClient; from importlib.resources import files; assert files("exness").joinpath("py.typed").is_file()'

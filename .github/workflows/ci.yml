name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: python-sdk
      - name: Read pinned Go revision
        id: peer
        run: python3 -c 'import json; print("revision=" + json.load(open("python-sdk/tools/parity-peer.json"))["revision"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: angru/exness-go
          ref: ${{ steps.peer.outputs.revision }}
          path: go-sdk
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - run: uv sync --locked
        working-directory: python-sdk
      - run: go mod download
        working-directory: go-sdk
      - name: Compare shared fixtures and actual SDK results
        env:
          UV_OFFLINE: "1"
          GOPROXY: "off"
          GOTOOLCHAIN: local
          PEER_REVISION: ${{ steps.peer.outputs.revision }}
        run: >-
          python3 python-sdk/tools/check_parity.py
          --python-root python-sdk --go-root go-sdk
          --peer go --peer-revision "$PEER_REVISION"
      - name: Compare public SDKs over loopback TLS
        working-directory: python-sdk
        env:
          UV_OFFLINE: "1"
          PEER_REVISION: ${{ steps.peer.outputs.revision }}
        run: |
          unformatted=$(gofmt -l tools/transport_driver.go)
          test -z "$unformatted"
          uv run --no-sync python -m tools.check_transport \
            --go-root ../go-sdk --go-revision "$PEER_REVISION"

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Check pinned public API compatibility
        run: uv run python -m tools.check_public_api
      - run: uv run pytest
      - name: Verify installed wheel consumers and typing
        run: sh tools/check-installed.sh
